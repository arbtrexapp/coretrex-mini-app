<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Coretrex</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #17201b;
    }

    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: #ffffff;
    }

    .top {
      background: #087f3e;
      color: white;
      padding: 42px 25px 35px;
      border-radius: 0 0 28px 28px;
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: white;
      color: #087f3e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .top h1 {
      margin: 0;
      font-size: 30px;
    }

    .top p {
      margin: 8px 0 0;
      opacity: .9;
      font-size: 14px;
    }

    .content {
      padding: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .muted {
      color: #69756e;
      font-size: 14px;
      line-height: 1.5;
    }

    .field {
      margin-top: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d5ddd8;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #087f3e;
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 18px;
    }

    .primary {
      background: #087f3e;
      color: white;
    }

    .telegram {
      background: #eaf4ef;
      color: #087f3e;
    }

    .secondary {
      background: transparent;
      color: #087f3e;
      border: 1px solid #cbd8d0;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #e9f7ef;
      color: #17683c;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #a32121;
    }

    .hidden {
      display: none !important;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 22px 0 5px;
      color: #89938d;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #e1e6e3;
      flex: 1;
    }

    .debug {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #f5f7f6;
      font-size: 12px;
      color: #68736d;
      word-break: break-word;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="top">

    <div class="logo">C</div>

    <h1>Coretrex</h1>

    <p>Digital Trading & Investment Platform</p>

  </div>


  <div class="content">

    <div id="loginScreen">

      <h2 id="title">Welcome back</h2>

      <p class="muted" id="subtitle">
        Sign in to continue to your Coretrex account.
      </p>


      <div id="nameField" class="field hidden">

        <label for="name">
          Full Name
        </label>

        <input
          id="name"
          type="text"
          placeholder="Enter your full name">

      </div>


      <div class="field">

        <label for="email">
          Email Address
        </label>

        <input
          id="email"
          type="email"
          placeholder="Enter your email">

      </div>


      <div class="field">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          placeholder="Enter your password">

      </div>


      <button
        id="loginBtn"
        class="primary"
        type="button">

        Login

      </button>


      <div class="divider">
        OR
      </div>


      <button
        id="telegramBtn"
        class="telegram"
        type="button">

        Continue with Telegram

      </button>


      <button
        id="modeBtn"
        class="secondary"
        type="button">

        Create Account

      </button>


      <div
        id="message"
        class="message">
      </div>


      <div
        id="debug"
        class="debug">

        Coretrex is ready.

      </div>

    </div>


    <div
      id="dashboard"
      class="hidden">

      <h2>Welcome to Coretrex</h2>

      <p class="muted">
        You are successfully signed in.
      </p>

      <div class="card">

        <p>
          <strong>Email:</strong>
          <span id="userEmail"></span>
        </p>

        <button
          id="logoutBtn"
          class="secondary"
          type="button">

          Logout

        </button>

      </div>

    </div>

  </div>

</div>


<script>

  const SUPABASE_URL =
    "https://gttfjmoyggyunhaojcxg.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_UPsL7MaeNjsbh8InoyfmxQ_LPi8LLkm";


  let supabaseClient = null;

  let registerMode = false;


  const message =
    document.getElementById("message");

  const debug =
    document.getElementById("debug");


  function showMessage(text, type) {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  function setDebug(text) {

    debug.textContent = text;

  }


  function setRegisterMode(value) {

    registerMode = value;

    const title =
      document.getElementById("title");

    const subtitle =
      document.getElementById("subtitle");

    const nameField =
      document.getElementById("nameField");

    const loginBtn =
      document.getElementById("loginBtn");

    const modeBtn =
      document.getElementById("modeBtn");


    if (registerMode) {

      title.textContent =
        "Create your account";

      subtitle.textContent =
        "Create a Coretrex account using your email and password.";

      nameField.classList.remove(
        "hidden"
      );

      loginBtn.textContent =
        "Create Account";

      modeBtn.textContent =
        "Back to Login";

    } else {

      title.textContent =
        "Welcome back";

      subtitle.textContent =
        "Sign in to continue to your Coretrex account.";

      nameField.classList.add(
        "hidden"
      );

      loginBtn.textContent =
        "Login";

      modeBtn.textContent =
        "Create Account";

    }

  }


  async function start() {

    try {

      if (
        !window.supabase ||
        !window.supabase.createClient
      ) {

        setDebug(
          "ERROR: Supabase JavaScript library did not load."
        );

        showMessage(
          "The Supabase library could not be loaded.",
          "error"
        );

        return;

      }


      supabaseClient =
        window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );


      setDebug(
        "Supabase connection initialized successfully."
      );


      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();


      if (error) {

        throw error;

      }


      if (
        data &&
        data.session &&
        data.session.user
      ) {

        showDashboard(
          data.session.user
        );

      }


    } catch (error) {

      console.error(error);

      setDebug(
        "ERROR: " +
        (error.message || String(error))
      );

      showMessage(
        error.message ||
        "Unable to initialize Coretrex.",
        "error"
      );

    }

  }


  async function login() {

    if (!supabaseClient) {

      showMessage(
        "Coretrex has not finished loading. Please refresh the page.",
        "error"
      );

      return;

    }


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    if (!email) {

      showMessage(
        "Please enter your email address.",
        "error"
      );

      return;

    }


    if (!password) {

      showMessage(
        "Please enter your password.",
        "error"
      );

      return;

    }


    if (
      registerMode &&
      !name
    ) {

      showMessage(
        "Please enter your full name.",
        "error"
      );

      return;

    }


    const button =
      document.getElementById(
        "loginBtn"
      );


    button.disabled = true;

    button.textContent =
      registerMode
        ? "Creating..."
        : "Signing in...";


    try {

      if (registerMode) {

        const {
          data,
          error
        } =
          await supabaseClient.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {
                full_name: name
              }

            }

          });


        if (error) {

          throw error;

        }


        if (
          data &&
          data.session &&
          data.user
        ) {

          showDashboard(
            data.user
          );

        } else {

          showMessage(
            "Account created. You can now sign in.",
            "success"
          );

          setDebug(
            "Registration completed successfully."
          );

        }

      } else {

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({

              email: email,

              password: password

            });


        if (error) {

          throw error;

        }


        if (
          data &&
          data.user
        ) {

          showDashboard(
            data.user
          );

        }

      }

    } catch (error) {

      console.error(error);

      showMessage(
        error.message ||
        "Login failed.",
        "error"
      );

      setDebug(
        "Authentication error: " +
        (
          error.message ||
          String(error)
        )
      );

    } finally {

      button.disabled = false;

      button.textContent =
        registerMode
          ? "Create Account"
          : "Login";

    }

  }


  function showDashboard(user) {

    document
      .getElementById("loginScreen")
      .classList.add("hidden");

    document
      .getElementById("dashboard")
      .classList.remove("hidden");

    document
      .getElementById("userEmail")
      .textContent =
        user.email || "";

  }


  document
    .getElementById("loginBtn")
    .addEventListener(
      "click",
      login
    );


  document
    .getElementById("modeBtn")
    .addEventListener(
      "click",
      () => {

        setRegisterMode(
          !registerMode
        );

        message.className =
          "message";

      }
    );


  document
    .getElementById("telegramBtn")
    .addEventListener(
      "click",
      () => {

        showMessage(
          "Telegram login is not connected yet. Email/password login is being tested first.",
          "error"
        );

      }
    );


  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      async () => {

        if (supabaseClient) {

          await supabaseClient.auth.signOut();

        }

        location.reload();

      }
    );


  start();

</script>

</body>
</html>
